services:
  - type: web
    name: bastion-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: bastion-coop-server
    runtime: node
    plan: starter
    rootDir: multiplayer-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

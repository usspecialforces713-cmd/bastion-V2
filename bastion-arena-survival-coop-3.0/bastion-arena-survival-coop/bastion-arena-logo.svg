<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48e7dc"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#05040f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Anneaux de l'arène -->
  <g fill="none" stroke="#48e7dc" stroke-opacity="0.35" stroke-width="2">
    <circle cx="400" cy="170" r="150"/>
    <circle cx="400" cy="170" r="118" stroke="#ff2bd6" stroke-opacity="0.3"/>
    <circle cx="400" cy="170" r="86" stroke-opacity="0.25"/>
  </g>

  <!-- Emblème : bouclier hexagonal -->
  <g filter="url(#glow)">
    <polygon points="400,70 478,115 478,205 400,250 322,205 322,115"
             fill="#0c0a22" stroke="url(#neon)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="400,94 456,126 456,194 400,226 344,194 344,126"
             fill="none" stroke="#48e7dc" stroke-opacity="0.6" stroke-width="2"/>
    <!-- Cœur du réacteur -->
    <polygon points="400,130 425,160 400,190 375,160" fill="#7af5e3"/>
    <circle cx="400" cy="160" r="8" fill="#ffffff"/>
  </g>

  <!-- Titre -->
  <g filter="url(#glow)" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif">
    <text x="400" y="312" font-size="60" letter-spacing="6" fill="url(#neon)">BASTION ARENA</text>
    <text x="400" y="352" font-size="26" letter-spacing="14" fill="#ffffff" fill-opacity="0.9">SURVIVAL</text>
  </g>

  <!-- Liseré de séparation -->
  <line x1="260" y1="368" x2="540" y2="368" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
